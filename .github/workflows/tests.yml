name: Tests

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

# A branch with an open PR triggers BOTH a push and a pull_request run of the
# full 40-job matrix; ~80 concurrent jobs contend for runners and (with the
# oversubscribed MPI tests below) can push individual jobs past the timeout.
# Normalize both event types to one group per branch so the newer run cancels
# the older duplicate.
concurrency:
  group: tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      matrix:
        mpi: [ 'yes', 'no' ]
        scipy: [ 'yes', 'no' ]
        python-numpy-version:
          [ [ '3.10', '1.26.4' ],
            [ '3.10', '2.2.3' ],
            [ '3.11', '1.26.4' ],
            [ '3.11', '2.2.3' ],
            [ '3.12', '1.26.4' ],
            [ '3.12', '2.2.3' ],
            [ '3.13', '2.2.3' ],
            [ '3.13', '2.5.4' ],
            [ '3.14', '2.3.5' ],  # first numpy series supporting 3.14
            [ '3.14', '2.5.4' ] ]
        mpi4py-version: [ '4.1.2' ]  # 4.1 is the first series supporting 3.14

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up python3 ${{ matrix.python-numpy-version[0] }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-numpy-version[0] }}

      - name: Install dependencies and extension module
        run: |
          set -x
          sudo apt-get update -qy
          sudo apt-get install -y python3-dev python3-venv libfftw3-dev libopenblas-dev
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install flit numpy pip-tools setuptools wheel
          if [ "${{ matrix.mpi }}" == "yes" ]; then
            # We now need to recompile some modules to link with native MPI
            sudo apt-get install openmpi-bin libopenmpi-dev libfftw3-mpi-dev libhdf5-mpi-dev libpnetcdf-dev libnetcdf-pnetcdf-dev
            export CC=mpicc
            python3 -m pip install -v --no-binary mpi4py mpi4py==${{ matrix.mpi4py-version }} numpy==${{ matrix.python-numpy-version[1] }}
            python3 -m pip install -v .[test,mpi]
          else
            python3 -m pip install -v numpy==${{ matrix.python-numpy-version[1] }} .[test]
          fi

      - name: Test with pytest
        run: |
          source venv/bin/activate
          if [ "${{ matrix.mpi }}" == "yes" ]; then
            # Up to 10 ranks share the runner's ~2 vCPUs: make blocked ranks
            # yield the CPU instead of busy-wait spinning, which degrades
            # superlinearly on noisy/oversubscribed VMs and has pushed jobs
            # past the timeout.
            export OMPI_MCA_mpi_yield_when_idle=1
            for nbprocs in 1 2 4 8 10; do
              echo "=== $nbprocs MPI processes ==="
              # `coverage run` (parallel mode, set in pyproject.toml) writes a
              # separate data file per rank; they are merged below.
              mpirun --oversubscribe -n $nbprocs coverage run -m pytest --verbose --full-trace
            done
          else
            coverage run -m pytest --verbose --full-trace -s
          fi
          coverage combine
          coverage xml
          coverage report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: mpi-${{ matrix.mpi }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # FFT engines against muGrid; with MPI, muGrid is compiled against the
  # same MPI library as mpi4py
  tests-mugrid:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      matrix:
        mpi: [ 'yes', 'no' ]
        python-version: [ '3.12', '3.13', '3.14' ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up python3 ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update -qy
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          if [ "${{ matrix.mpi }}" == "yes" ]; then
            sudo apt-get install -y openmpi-bin libopenmpi-dev
            export CC=mpicc CXX=mpicxx
            python3 -m pip install -v --no-binary mpi4py --no-binary muGrid .[test,mpi,fft]
          else
            python3 -m pip install -v .[test,fft]
          fi
          python3 -c "import muGrid; print('muGrid', muGrid.__version__, 'MPI:', muGrid.has_mpi)"

      - name: Test with pytest
        run: |
          source venv/bin/activate
          if [ "${{ matrix.mpi }}" == "yes" ]; then
            python3 -c "import muGrid, sys; sys.exit(0 if muGrid.has_mpi else 'muGrid was compiled without MPI')"
            export OMPI_MCA_mpi_yield_when_idle=1
            for nbprocs in 1 2 4; do
              echo "=== $nbprocs MPI processes ==="
              mpirun --oversubscribe -n $nbprocs python3 -m pytest --verbose --full-trace test/test_fft.py test/test_fft_mugrid.py
            done
          else
            python3 -m pytest --verbose --full-trace test/test_fft.py test/test_fft_mugrid.py
          fi
