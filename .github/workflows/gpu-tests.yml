name: GPU Tests

# On muGrid's self-hosted CUDA runner. Like muGrid's GPU workflow, it runs
# for pushes to main and for tags only -- never for pull requests, so that
# code from forks does not reach the self-hosted machine -- and can be
# started by hand for a branch.
on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  gpu-tests:
    runs-on: linux-x86-cuda
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show GPU
        run: nvidia-smi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install NuMPI with the test dependencies and CuPy
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          # The prebuilt CUDA 12 wheel of CuPy (with its CUDA libraries)
          # rather than the [gpu] extra's generic package, which would build
          # from source
          python3 -m pip install ".[test]" "cupy-cuda12x[ctk]" nvidia-nvjitlink-cu12
          python3 -c "import cupy; print('CuPy', cupy.__version__, 'on', cupy.cuda.runtime.getDeviceProperties(0)['name'])"

      - name: Run the tests on NumPy, array_api_strict and CuPy arrays
        env:
          # Fail rather than skip if CuPy or the GPU is not usable
          NUMPI_REQUIRE_CUPY: '1'
        run: |
          source venv/bin/activate
          # -rs lists skips: here the CuPy cases must run, not skip
          python3 -m pytest test/Optimization/test_bounded_tr_newton_namespaces.py -v -rs
